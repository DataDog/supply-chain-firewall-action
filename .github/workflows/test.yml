name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Set up a custom blocklist so we can test blocking without relying
      # on the live malicious-package database.
      - name: Prepare scfw-home with custom blocklist
        shell: bash
        run: |
          mkdir -p /tmp/test-scfw-home/list_verifier
          cat > /tmp/test-scfw-home/list_verifier/test-blocklist.yml << 'EOF'
          findings:
            - severity: CRITICAL
              finding: Test entry for Supply Chain Firewall action CI
              packages:
                - name: requests
                  ecosystem: PyPI
          EOF

      - name: Run the action under test
        id: run-action
        uses: ./
        with:
          scfw-home: /tmp/test-scfw-home
          error-on-block: 'true'

      # --- version output ---

      - name: scfw-version output is set
        shell: bash
        run: |
          version="${{ steps.run-action.outputs.scfw-version }}"
          echo "scfw-version output: $version"
          [ -n "$version" ] || { echo "FAIL: scfw-version output is empty"; exit 1; }

      # --- Wrapper installation ---

      - name: pip wrapper is in PATH
        shell: bash
        run: |
          wrapper="$(which pip)"
          echo "pip resolves to: $wrapper"
          [[ "$wrapper" == *"scfw-wrappers"* ]] || { echo "FAIL: pip wrapper not active"; exit 1; }

      - name: npm wrapper is in PATH
        shell: bash
        run: |
          wrapper="$(which npm)"
          echo "npm resolves to: $wrapper"
          [[ "$wrapper" == *"scfw-wrappers"* ]] || { echo "FAIL: npm wrapper not active"; exit 1; }

      # --- Pass-through: a clean package installs normally ---

      - name: Clean pip install succeeds
        shell: bash
        run: pip install urllib3

      # --- Blocking: a blocklisted package is rejected ---

      - name: Blocked pip install fails
        shell: bash
        run: |
          if pip install requests; then
            echo "FAIL: blocked package was not rejected"
            exit 1
          fi
          echo "PASS: blocked package was correctly rejected"

  test-on-warning:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # Add requests to the blocklist at WARNING severity. With on-warning: 'ALLOW',
      # the install should succeed despite the finding.
      - name: Prepare scfw-home with warning-level blocklist entry
        shell: bash
        run: |
          mkdir -p /tmp/test-scfw-home/list_verifier
          cat > /tmp/test-scfw-home/list_verifier/test-blocklist.yml << 'EOF'
          findings:
            - severity: WARNING
              finding: Test warning entry for Supply Chain Firewall action CI
              packages:
                - name: requests
                  ecosystem: PyPI
          EOF

      - name: Run the action under test with on-warning set to ALLOW
        uses: ./
        with:
          scfw-home: /tmp/test-scfw-home
          error-on-block: 'true'
          on-warning: 'ALLOW'

      - name: Warning-level package installs successfully with on-warning ALLOW
        shell: bash
        run: pip install requests

  test-package-minimum-age:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run the action with a minimum package age suitable for testing
        uses: ./
        with:
          error-on-block: 'true'
          package-minimum-age: '8760000000'  # 1 million years in hours

      - name: pip install fails due to package minimum age
        shell: bash
        run: |
          if pip install requests; then
            echo "FAIL: install should have been blocked by minimum age requirement"
            exit 1
          fi
          echo "PASS: install correctly blocked by minimum age requirement"

  test-version-pinning:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run the action with a pinned SCFW version
        id: run-action
        uses: ./
        with:
          version: '2.6.1'

      - name: scfw-version output matches pinned version
        shell: bash
        run: |
          version="${{ steps.run-action.outputs.scfw-version }}"
          echo "scfw-version output: $version"
          [[ "$version" == *"2.6.1"* ]] || { echo "FAIL: expected version 2.6.1, got '$version'"; exit 1; }

  test-error-on-block-false:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Prepare scfw-home with custom blocklist
        shell: bash
        run: |
          mkdir -p /tmp/test-scfw-home/list_verifier
          cat > /tmp/test-scfw-home/list_verifier/test-blocklist.yml << 'EOF'
          findings:
            - severity: CRITICAL
              finding: Test entry for Supply Chain Firewall action CI
              packages:
                - name: requests
                  ecosystem: PyPI
          EOF

      - name: Run the action with error-on-block disabled
        uses: ./
        with:
          scfw-home: /tmp/test-scfw-home
          error-on-block: 'false'

      - name: Blocked pip install exits cleanly with error-on-block false
        shell: bash
        run: |
          pip install requests
          echo "PASS: blocked install did not fail the step"

  test-package-managers-subset:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run the action with only pip in package-managers
        uses: ./
        with:
          package-managers: 'pip'

      - name: pip wrapper is in PATH
        shell: bash
        run: |
          wrapper="$(which pip)"
          echo "pip resolves to: $wrapper"
          [[ "$wrapper" == *"scfw-wrappers"* ]] || { echo "FAIL: pip wrapper not active"; exit 1; }

      - name: npm wrapper is not in PATH
        shell: bash
        run: |
          wrapper="$(which npm)"
          echo "npm resolves to: $wrapper"
          [[ "$wrapper" != *"scfw-wrappers"* ]] || { echo "FAIL: npm should not be wrapped"; exit 1; }

  test-dd-log-attributes:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run the action with custom log attributes
        uses: ./
        with:
          dd-log-attributes: '{"team":"security"}'

      - name: SCFW_DD_LOG_ATTRIBUTES is set correctly
        shell: bash
        run: |
          echo "SCFW_DD_LOG_ATTRIBUTES=$SCFW_DD_LOG_ATTRIBUTES"
          [[ "$SCFW_DD_LOG_ATTRIBUTES" == '{"team":"security"}' ]] || { echo "FAIL: unexpected value '$SCFW_DD_LOG_ATTRIBUTES'"; exit 1; }
