name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Run the action under test
        id: run-action
        uses: ./
        with:
          version: '4.0.0'
          package-managers: npm,pip
          dd-api-key: test-api-key
          dd-app-key: test-app-key

      - name: Go binary and version output are available
        shell: bash
        run: |
          output_version="${{ steps.run-action.outputs.scfw-version }}"
          command_version="$(scfw --version)"
          echo "action output: $output_version"
          echo "installed binary: $command_version"
          [[ "$output_version" == "4.0.0" ]]
          [[ "$command_version" == *"4.0.0"* ]]

      - name: Requested package managers are wrapped
        shell: bash
        run: |
          pip_wrapper="$(which pip)"
          npm_wrapper="$(which npm)"
          echo "pip resolves to: $pip_wrapper"
          echo "npm resolves to: $npm_wrapper"
          [[ "$pip_wrapper" == *"scfw-wrappers"* ]]
          [[ "$npm_wrapper" == *"scfw-wrappers"* ]]
          grep -q -- '--error-on-block --' "$pip_wrapper"

      - name: Unrequested package managers are not wrapped
        shell: bash
        run: |
          poetry_path="$(command -v poetry || true)"
          [[ "$poetry_path" != *"scfw-wrappers"* ]]

      - name: Go CLI environment is configured
        shell: bash
        run: |
          [[ "$DD_API_KEY" == "test-api-key" ]]
          [[ "$DD_APP_KEY" == "test-app-key" ]]
          [[ "$DD_SITE" == "datadoghq.com" ]]

  test-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run with optional Go CLI settings
        uses: ./
        with:
          version: '4.0.0'
          package-managers: pip
          error-on-block: 'false'
          debug: 'true'
          on-warning: 'ALLOW'
          scfw-home: /tmp/test-scfw-home
          dd-site: datadoghq.eu
          dd-api-key: test-api-key
          dd-app-key: test-app-key

      - name: Optional settings are applied
        shell: bash
        run: |
          pip_wrapper="$(which pip)"
          grep -q -- '--log-level DEBUG --' "$pip_wrapper"
          if grep -q -- '--error-on-block' "$pip_wrapper"; then
            echo "error-on-block should not be enabled" >&2
            exit 1
          fi
          [[ "$SCFW_ON_WARNING" == "ALLOW" ]]
          [[ "$SCFW_HOME" == "/tmp/test-scfw-home" ]]
          [[ "$DD_SITE" == "datadoghq.eu" ]]
          [[ -d "$SCFW_HOME" ]]

  test-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reject a legacy Python release
        id: legacy-version
        continue-on-error: true
        uses: ./
        with:
          version: '3.1.0'
          dd-api-key: test-api-key
          dd-app-key: test-app-key

      - name: Legacy release was rejected
        shell: bash
        run: test "${{ steps.legacy-version.outcome }}" = failure

      - name: Reject an unsupported package manager
        id: unsupported-package-manager
        continue-on-error: true
        uses: ./
        with:
          version: '4.0.0'
          package-managers: pip,bundler
          dd-api-key: test-api-key
          dd-app-key: test-app-key

      - name: Unsupported package manager was rejected
        shell: bash
        run: test "${{ steps.unsupported-package-manager.outcome }}" = failure
