name: Example - Supply Chain Firewall

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      # Cache scfw verifier data across runs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.scfw
          key: scfw-${{ runner.os }}

      # Install and configure Supply Chain Firewall
      - uses: DataDog/supply-chain-firewall-action@2f166ae1d2c34ed717d7b08427c7acb57804f3f5 # v1.0.0
        with:
          scfw-home: ~/.scfw
          dd-api-key: ${{ secrets.DD_API_KEY }}
          dd-api-logger: 'true'
          dd-env: 'prod'
          on-warning: 'BLOCK'

      # These commands are now transparently intercepted by Supply Chain Firewall.
      # Malicious packages are blocked before installation.
      - run: pip install -r requirements.txt
      - run: npm install
