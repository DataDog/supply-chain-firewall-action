name: Example - Supply Chain Firewall

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Cache scfw verifier data across runs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.scfw
          key: scfw-${{ runner.os }}

      # Install and configure Supply Chain Firewall
      - uses: DataDog/supply-chain-firewall-action@2f166ae1d2c34ed717d7b08427c7acb57804f3f5 # v1.0.0
        with:
          scfw-home: ~/.scfw
          dd-api-key: ${{ secrets.DD_API_KEY }}
          dd-api-logger: 'true'
          dd-env: 'prod'
          on-warning: 'BLOCK'

      # These commands are now transparently intercepted by Supply Chain Firewall.
      # Malicious packages are blocked before installation.
      - run: pip install -r requirements.txt
      - run: npm install
