name: 'Deploy Supply Chain Firewall'
description: >
  Install the Go version of Datadog's Supply Chain Firewall (SCFW) and configure it to
  transparently intercept supported package manager commands for all subsequent job steps.

inputs:
  version:
    description: >
      The Go-based SCFW release to install. Use "latest" for the most recent release,
      or pin to an explicit v4+ version (for example, "4.0.0").
    required: false
    default: 'latest'

  package-managers:
    description: >
      Comma-separated list of package managers whose commands should be inspected.
      Supported values: pip, npm, poetry.
    required: false
    default: 'npm,pip,poetry'

  error-on-block:
    description: >
      When "true", blocked package installations exit with a non-zero status and fail
      the workflow step. Set to "false" to let blocked commands exit successfully.
    required: false
    default: 'true'

  dd-api-key:
    description: >
      Datadog API key used for Code Security policy evaluation and reporting.
      Treat this value as a secret.
    required: true

  dd-app-key:
    description: >
      Datadog application key used for Code Security policy evaluation and reporting.
      Treat this value as a secret.
    required: true

  debug:
    description: >
      When "true", enables local SCFW debug logging. Debug logs may include Code Security
      API request and response bodies, so review workflow logs before sharing them.
    required: false
    default: 'false'

  dd-site:
    description: >
      Datadog site for policy evaluation and reporting (for example, datadoghq.eu or
      us3.datadoghq.com).
    required: false
    default: 'datadoghq.com'

  scfw-home:
    description: >
      Directory for SCFW's local cache. Defaults to a temporary directory when omitted.
    required: false
    default: ''

  on-warning:
    description: >
      Action to take for warning-level findings: "ALLOW" or "BLOCK". In non-interactive
      environments SCFW defaults to "BLOCK" when this input is omitted.
    required: false
    default: ''

outputs:
  scfw-version:
    description: 'The installed version of SCFW.'
    value: ${{ steps.configure-scfw.outputs.scfw-version }}

runs:
  using: 'composite'
  steps:
    - name: Install and configure Supply Chain Firewall
      id: configure-scfw
      shell: bash
      env:
        SCFW_VERSION: ${{ inputs.version }}
        SCFW_PACKAGE_MANAGERS: ${{ inputs.package-managers }}
        SCFW_ERROR_ON_BLOCK: ${{ inputs.error-on-block }}
        INPUT_DD_API_KEY: ${{ inputs.dd-api-key }}
        INPUT_DD_APP_KEY: ${{ inputs.dd-app-key }}
        INPUT_DD_SITE: ${{ inputs.dd-site }}
        INPUT_SCFW_HOME: ${{ inputs.scfw-home }}
        INPUT_ON_WARNING: ${{ inputs.on-warning }}
        INPUT_DEBUG: ${{ inputs.debug }}
      run: "$GITHUB_ACTION_PATH/scripts/setup.sh"
